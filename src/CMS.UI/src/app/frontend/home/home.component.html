<main class="main">
  <div class="container">
    <div class="mt-2 mb-5" *ngIf="homepageSliders.length > 0">
      <p-galleria
        [value]="homepageSliders"
        [showIndicators]="true"
        [showThumbnails]="false"
        [showItemNavigators]="true"
        [circular]="true"
      >
        <ng-template #item let-item>
          <img
            id="homeSliderImg"
            (click)="onSliderClick(item)"
            [src]="environment.host + item.imageUrl"
            class="d-block w-100 cursor-pointer"
          />
        </ng-template>
        <ng-template #caption let-item>
          <div (click)="onSliderClick(item)" class="cursor-pointer">
            <div class="text-xl mb-2 font-bold">{{ item.title }}</div>
            <div class="text-white" *ngIf="item.description != null">
              {{ item.description }}
            </div>
          </div>
        </ng-template>
      </p-galleria>
    </div>
    <div class="mb-5" *ngIf="jobs.length > 0">
      <p-panel [showHeader]="false">
        <div class="d-flex mt-3 mb-2">
          <h4 class="ms-md-2 flex-grow-1 align-content-center">
            {{ "Jobs" | translate }}
          </h4>
          <a routerLink="job" class="all-link me-md-2">
            {{ "All" | translate }}
            <i class="pi pi-arrow-right"></i>
          </a>
        </div>
        <p-carousel
          [value]="jobs"
          [numVisible]="3"
          [numScroll]="3"
          [circular]="true"
          [responsiveOptions]="responsiveOptions"
          autoplayInterval="6000"
          [showNavigators]="false"
        >
          <ng-template let-job #item>
            <div
              class="cursor-pointer border rounded-1 m-md-2 p-3 d-flex"
              routerLink="job/{{ job.id }}"
            >
              <div class="">
                <img src="{{ environment.host }}{{ job.tenantImageUrl }}" />
              </div>
              <div class="ms-3">
                <h5 class="mb-2 tenant-name">
                  {{ job.tenantName }}
                </h5>
                <h6 class="mb-2 position-name">
                  {{ job.position }}
                </h6>
                <div class="badge text-bg-secondary text-white">
                  {{ job.jobLocationName }}
                </div>
              </div>
            </div>
          </ng-template>
        </p-carousel>
      </p-panel>
    </div>
    <div class="mb-5" *ngIf="blogs.length > 0">
      <p-panel [showHeader]="false">
        <div class="d-flex mt-3 mb-2">
          <h4 class="ms-md-2 flex-grow-1 align-content-center">
            {{ "Blogs" | translate }}
          </h4>
          <a routerLink="blog" class="all-link me-md-2">
            {{ "All" | translate }}
            <i class="pi pi-arrow-right"></i>
          </a>
        </div>
        <p-carousel
          [value]="blogs"
          [numVisible]="3"
          [numScroll]="3"
          [circular]="true"
          [responsiveOptions]="responsiveOptions"
          autoplayInterval="6000"
          [showNavigators]="false"
        >
          <ng-template let-blog #item>
            <div
              class="m-md-2 cursor-pointer"
              routerLink="/blog/{{ blog.url }}/{{ blog.id }}"
            >
              <div class="mb-2">
                <img
                  class="blog-img"
                  src="{{ environment.host }}{{ blog.imageUrl }}"
                />
              </div>
              <h6 class="mt-2">{{ blog.title }}</h6>
            </div>
          </ng-template>
        </p-carousel>
      </p-panel>
    </div>
  </div>
</main>
