<p-toast />
<main class="main">
  <div class="row">
    <div class="col-12">
      <p-panel [showHeader]="false">
        <div class="p-3">
          <h2 class="my-3">{{ "Profile" | translate }}</h2>
          <form [formGroup]="form">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">{{ "Name" | translate }}</label>
                  <input
                    pInputText
                    class="w-100"
                    formControlName="name"
                    [ngClass]="{ 'is-invalid': submitted && f['name'].errors }"
                  />
                  <div
                    *ngIf="submitted && f['name'].errors"
                    class="invalid-feedback"
                  >
                    <div *ngIf="f['name'].errors['required']">
                      {{ "Name.Required" | translate }}
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">{{ "Surname" | translate }}</label>
                  <input
                    pInputText
                    class="w-100"
                    formControlName="surname"
                    [ngClass]="{
                      'is-invalid': submitted && f['surname'].errors
                    }"
                  />
                  <div
                    *ngIf="submitted && f['surname'].errors"
                    class="invalid-feedback"
                  >
                    <div *ngIf="f['surname'].errors['required']">
                      {{ "Surname.Required" | translate }}
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">{{
                    "EmailAddress" | translate
                  }}</label>
                  <input
                    pInputText
                    class="w-100"
                    formControlName="emailAddress"
                  />
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">{{ "Phone" | translate }}</label>
                  <p-inputmask
                    styleClass="w-100"
                    mask="(999) 999-9999"
                    formControlName="phone"
                    placeholder="(999) 999-9999"
                    [ngClass]="{
                      'is-invalid': submitted && f['phone'].errors
                    }"
                  />
                  <div
                    *ngIf="submitted && f['phone'].errors"
                    class="invalid-feedback"
                  >
                    <div *ngIf="f['phone'].errors['required']">
                      {{ "Phone.Required" | translate }}
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="mt-3">
              <p-button
                size="small"
                label="{{ 'Save' | translate }}"
                severity="warn"
                styleClass="px-3"
                (click)="save($event)"
              ></p-button>
            </div>
          </form>
        </div>
      </p-panel>
    </div>
  </div>
</main>
